<!DOCTYPE html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkOn v9 · 对话即界面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   WorkOn v9 — 对话即界面
   壳层只剩三样：顶栏 / 对话 / 面板
   面板里的卡片不是写死的模块，是对话聊出来的
   ══════════════════════════════════════════════════════════════ */
:root{
  --f-sans:'Outfit','MiSans','HarmonyOS Sans SC','PingFang SC','Noto Sans SC','Microsoft YaHei UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Consolas',monospace;
  --t-d:28px; --t-d-l:34px; --t-h1:21px; --t-h1-l:28px; --t-h2:16px; --t-h2-l:23px;
  --t-b:13px; --t-b-l:20px; --t-s:12px; --t-s-l:18px; --t-c:11px; --t-c-l:16px; --t-m:10px; --t-m-l:14px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:999px;
  --e-out:cubic-bezier(.22,1,.36,1); --e-sp:cubic-bezier(.34,1.32,.64,1);
  --t-mi:120ms; --t-hv:160ms; --t-pn:240ms; --t-pg:320ms;
  --ai-1:#6366F1; --ai-2:#8B5CF6; --ai-3:#06B6D4;
  --aura:linear-gradient(120deg,var(--ai-1),var(--ai-2) 52%,var(--ai-3));
}
[data-mode="light"]{
  --canvas:#F3F1ED;
  --g-a:rgba(14,140,127,.055); --g-b:rgba(99,102,241,.035);
  --s1-bg:#FFFFFF; --s2-bg:#FAF9F7; --s3-bg:#F1EFEB; --inset:#F5F4F1; --chrome:#EFEDE8;
  --line:#E6E2DA; --line-2:#D7D2C8; --line-3:#C4BEB2;
  --tx1:#17161A; --tx2:#54514A; --tx3:#8A867C; --tx4:#ADA79A;
  --accent:#0E8C7F; --accent-hi:#0A7568; --accent-wash:rgba(14,140,127,.075);
  --accent-chip:rgba(14,140,127,.12); --accent-line:rgba(14,140,127,.28);
  --ok:#15803D; --ok-wash:rgba(21,128,61,.10);
  --warn:#B45309; --warn-wash:rgba(180,83,9,.10);
  --danger:#DC2626; --danger-wash:rgba(220,38,38,.10);
  --slack:#C2703C; --slack-wash:rgba(194,112,60,.12);
  --focus:#2F7DD1; --focus-wash:rgba(47,125,209,.10);
  --e1:0 1px 2px rgba(28,24,18,.05);
  --e2:0 1px 2px rgba(28,24,18,.05),0 4px 12px -3px rgba(28,24,18,.07);
  --e3:0 2px 4px rgba(28,24,18,.05),0 12px 28px -8px rgba(28,24,18,.12);
  --e4:0 8px 20px rgba(28,24,18,.10),0 28px 64px -14px rgba(28,24,18,.20);
  --ring:0 0 0 3px rgba(14,140,127,.16);
  --bub-user:#0E8C7F; --bub-user-tx:#fff;
}
[data-mode="dark"]{
  --canvas:#0D0E11;
  --g-a:rgba(20,184,166,.07); --g-b:rgba(139,92,246,.045);
  --s1-bg:#15171B; --s2-bg:#1B1E23; --s3-bg:#23262C; --inset:#101216; --chrome:#111318;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13); --line-3:rgba(255,255,255,.20);
  --tx1:#ECEDEF; --tx2:#A3A7AF; --tx3:#70747E; --tx4:#4B4F58;
  --accent:#14B8A6; --accent-hi:#2DD4BF; --accent-wash:rgba(20,184,166,.10);
  --accent-chip:rgba(20,184,166,.16); --accent-line:rgba(20,184,166,.34);
  --ok:#22C55E; --ok-wash:rgba(34,197,94,.12);
  --warn:#F59E0B; --warn-wash:rgba(245,158,11,.12);
  --danger:#EF4444; --danger-wash:rgba(239,68,68,.12);
  --slack:#E08A4C; --slack-wash:rgba(224,138,76,.14);
  --focus:#5B9BF0; --focus-wash:rgba(91,155,240,.12);
  --e1:0 1px 2px rgba(0,0,0,.40);
  --e2:0 1px 2px rgba(0,0,0,.40),0 4px 16px -3px rgba(0,0,0,.50);
  --e3:0 2px 6px rgba(0,0,0,.45),0 14px 34px -8px rgba(0,0,0,.60);
  --e4:0 10px 26px rgba(0,0,0,.55),0 30px 70px -14px rgba(0,0,0,.72);
  --ring:0 0 0 3px rgba(20,184,166,.20);
  --bub-user:#14B8A6; --bub-user-tx:#04201C;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:22px;font-family:var(--f-sans);font-size:var(--t-b);line-height:var(--t-b-l);color:var(--tx1);background:var(--canvas);-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 82% -14%,var(--g-a),transparent 60%),radial-gradient(900px 460px at 6% 112%,var(--g-b),transparent 58%)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.stage{position:relative;z-index:1;max-width:1400px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;flex-wrap:wrap}
.head h1{margin:0;font-size:var(--t-d);line-height:var(--t-d-l);font-weight:600;letter-spacing:-.02em}
.head p{margin:5px 0 0;color:var(--tx3);font-size:var(--t-b);max-width:72ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ── 窗口 ── */
.win{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--s1-bg);box-shadow:var(--e4);height:min(820px,calc(100vh - 132px));min-height:620px;display:flex;flex-direction:column}

/* ── 极简顶栏：无导航 ── */
.top{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);background:var(--chrome)}
.logo{width:28px;height:28px;border-radius:var(--r-sm);background:var(--aura);display:grid;place-items:center;box-shadow:0 3px 12px rgba(99,102,241,.28);flex:0 0 auto}
.logo svg{width:16px;height:16px;color:#fff}
.brand b{font-size:var(--t-h3);font-weight:600;letter-spacing:-.01em}
.brand span{font-size:var(--t-m);color:var(--tx3);display:block;line-height:12px;letter-spacing:.06em}
.sp{flex:1}
.tdate{font-size:var(--t-s);color:var(--tx3);white-space:nowrap}
.tdate b{color:var(--tx2);font-weight:500}
.ib{width:28px;height:28px;border:0;background:transparent;border-radius:var(--r-xs);color:var(--tx3);cursor:pointer;display:grid;place-items:center;transition:all var(--t-hv) var(--e-out)}
.ib svg{width:15px;height:15px}
.ib:hover{background:var(--s3-bg);color:var(--tx1)}
.ib.cl:hover{background:#DC2626;color:#fff}

/* ── 双栏 ── */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,44%) minmax(0,1fr)}
.chat{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:var(--s5) var(--s5) var(--s3)}
.msgs::-webkit-scrollbar{width:8px}.msgs::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
.msg{display:flex;gap:10px;margin-bottom:var(--s4);animation:fadeUp var(--t-pn) var(--e-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.u{flex-direction:row-reverse}
.face{width:28px;height:28px;border-radius:var(--r-full);flex:0 0 auto;background:linear-gradient(140deg,#FFD9C0,#F3B7A4 45%,#C9A0D8);box-shadow:inset 0 -2px 5px rgba(0,0,0,.12);display:grid;place-items:center;font-size:var(--t-m);color:#7A4A3A;font-weight:700}
.bub{max-width:84%;padding:9px 13px;border-radius:14px;font-size:var(--t-b);line-height:21px}
.msg.b .bub{background:var(--s1-bg);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--e1)}
.msg.u .bub{background:var(--bub-user);color:var(--bub-user-tx);border-bottom-right-radius:5px}
.bub em{font-style:normal;background:var(--accent-wash);padding:1px 4px;border-radius:4px;color:var(--accent);font-weight:500}
.bub .think{display:flex;gap:4px;padding:4px 0}
.bub .think i{width:6px;height:6px;border-radius:50%;background:var(--tx4);animation:bounce 1.1s infinite}
.bub .think i:nth-child(2){animation-delay:.15s}.bub .think i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.born{margin:6px 0 0;padding:9px 11px;border-radius:var(--r-md);background:var(--s2-bg);border:1px dashed var(--accent-line);font-size:var(--t-c);color:var(--tx2)}
.born b{color:var(--accent);font-weight:600}
.born span{display:inline-block;margin:4px 5px 0 0;padding:2px 7px;border-radius:var(--r-full);background:var(--accent-chip);color:var(--accent);font-size:var(--t-m)}

/* ── 输入区 ── */
.composer{padding:var(--s3) var(--s5) var(--s4);border-top:1px solid var(--line);background:var(--s1-bg)}
.cbox{display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 12px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--inset);transition:all var(--t-hv) var(--e-out)}
.cbox:focus-within{border-color:var(--accent);box-shadow:var(--ring);background:var(--s1-bg)}
.cbox textarea{flex:1;border:0;background:transparent;outline:none;resize:none;font-family:inherit;font-size:var(--t-b);line-height:20px;color:var(--tx1);max-height:88px;min-height:20px;padding:3px 0}
.cbox textarea::placeholder{color:var(--tx4)}
.send{width:30px;height:30px;flex:0 0 auto;border:0;border-radius:var(--r-sm);background:var(--accent);color:var(--bub-user-tx);cursor:pointer;display:grid;place-items:center;transition:all var(--t-hv) var(--e-out)}
.send:hover{background:var(--accent-hi);transform:translateY(-1px)}
.send svg{width:15px;height:15px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.qk{border:1px solid var(--line);background:var(--s2-bg);color:var(--tx2);cursor:pointer;font-family:inherit;font-size:var(--t-c);padding:5px 9px;border-radius:var(--r-full);transition:all var(--t-hv) var(--e-out)}
.qk:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash);transform:translateY(-1px)}

/* ── 面板 ── */
.panel{display:flex;flex-direction:column;min-width:0;background:var(--s1-bg)}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.tab{border:0;background:transparent;cursor:pointer;font-family:inherit;font-size:var(--t-b);color:var(--tx3);height:32px;padding:0 12px;border-radius:var(--r-sm);position:relative;transition:all var(--t-hv) var(--e-out);font-weight:500}
.tab:hover{color:var(--tx1);background:var(--s3-bg)}
.tab.on{color:var(--tx1)}
.tab.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tab .n{font-family:var(--f-mono);font-size:9px;color:var(--tx4);margin-left:4px}
.chips{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--s2-bg);color:var(--tx2);cursor:pointer;font-family:inherit;font-size:var(--t-c);padding:4px 10px;border-radius:var(--r-full);transition:all var(--t-hv) var(--e-out)}
.chip:hover{border-color:var(--line-2);color:var(--tx1)}
.chip.on{background:var(--accent);border-color:transparent;color:var(--bub-user-tx);font-weight:500}
.cards{flex:1;min-height:0;overflow-y:auto;padding:var(--s4) 14px var(--s8)}
.cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ── 空面板：首次上手的核心 ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:var(--s6);min-height:300px}
.empty .orb{width:56px;height:56px;border-radius:var(--r-full);background:var(--s3-bg);display:grid;place-items:center;margin-bottom:var(--s4);color:var(--tx4)}
.empty .orb svg{width:24px;height:24px}
.empty h3{margin:0 0 6px;font-size:var(--t-h1);line-height:var(--t-h1-l);font-weight:600;letter-spacing:-.01em}
.empty p{margin:0 0 var(--s5);color:var(--tx3);font-size:var(--t-b);max-width:30ch;line-height:21px}
.grow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:400px;width:100%}
.gc{border:1px dashed var(--line-2);background:transparent;cursor:pointer;font-family:inherit;font-size:var(--t-c);color:var(--tx2);padding:11px 10px;border-radius:var(--r-md);text-align:left;transition:all var(--t-hv) var(--e-out);display:flex;align-items:center;gap:8px}
.gc:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-wash);transform:translateY(-1px)}
.gc svg{width:15px;height:15px;flex:0 0 auto}

/* ── 卡片 ── */
.card{background:var(--s1-bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden;margin-bottom:12px;transition:box-shadow var(--t-hv) var(--e-out),border-color var(--t-hv) var(--e-out);animation:fadeUp var(--t-pn) var(--e-out) both}
.card:hover{box-shadow:var(--e2);border-color:var(--line-2)}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash),var(--e2)}
.c-h{display:flex;align-items:center;gap:7px;padding:11px 14px 0}
.c-h .ci{width:22px;height:22px;border-radius:var(--r-xs);display:grid;place-items:center;flex:0 0 auto;background:var(--s3-bg);color:var(--tx2)}
.c-h .ci svg{width:13px;height:13px}
.c-h .ci.trace{background:var(--accent-wash);color:var(--accent)}
.c-h .ci.method{background:rgba(47,125,209,.12);color:var(--focus)}
.c-h .ci.suggest{background:rgba(139,92,246,.13);color:var(--ai-2)}
.c-h .lbl{font-size:var(--t-c);color:var(--tx3)}
.c-h .lbl b{color:var(--accent);font-weight:600}
.c-h .lbl b.fm{color:var(--focus)}
.c-b{padding:9px 14px 13px}
.ct{font-size:15px;line-height:23px;font-weight:600;letter-spacing:-.005em;margin:0 0 6px}
.cd{font-size:var(--t-b);line-height:20px;color:var(--tx2);margin:0 0 11px}
.frow{margin-bottom:11px}
.frow:last-child{margin-bottom:0}
.flbl{font-size:var(--t-m);color:var(--tx4);letter-spacing:.08em;margin-bottom:6px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:var(--t-c);line-height:1;padding:5px 9px;border-radius:var(--r-xs);background:var(--s2-bg);border:1px solid var(--line);color:var(--tx2)}
.pill.acc{background:var(--accent-chip);border-color:transparent;color:var(--accent);font-weight:500}
.pill.solid{background:var(--accent);border-color:transparent;color:var(--bub-user-tx);font-weight:500}
.pill.on{background:var(--accent);border-color:transparent;color:var(--bub-user-tx);font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.dcell{background:var(--s2-bg);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 11px}
.dcell .dk{font-size:var(--t-m);color:var(--tx4);margin-bottom:3px}
.dcell .dv{font-size:var(--t-h2);line-height:22px;font-weight:600;letter-spacing:-.01em}
.dcell .dv.m{font-family:var(--f-mono)}
.dcell .dn{font-size:var(--t-c);color:var(--tx3);margin-top:3px;line-height:16px}
.pack{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 11px;border-radius:var(--r-md);background:var(--accent-wash);border:1px solid var(--accent-line);font-size:var(--t-c);color:var(--tx2)}
.pack b{color:var(--accent);font-weight:600;white-space:nowrap}
.pack .ar{color:var(--tx4)}

/* 建议卡：右侧 + 按钮 */
.sug{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--s2-bg);margin-bottom:8px;transition:all var(--t-hv) var(--e-out)}
.sug:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.sug .si{width:20px;height:20px;flex:0 0 auto;color:var(--tx3);margin-top:1px}
.sug .si svg{width:15px;height:15px}
.sug .sb{flex:1;min-width:0}
.sug .st{font-size:var(--t-b);font-weight:500;margin-bottom:2px}
.sug .sd{font-size:var(--t-c);color:var(--tx3);line-height:17px}
.add{width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-full);border:1px solid var(--line);background:var(--s1-bg);color:var(--tx2);cursor:pointer;display:grid;place-items:center;transition:all var(--t-hv) var(--e-sp)}
.add:hover{background:var(--accent);border-color:transparent;color:var(--bub-user-tx);transform:scale(1.1)}

/* ── 链路：一条线 ── */
.chain{display:flex;align-items:center;gap:0;padding:6px 0 2px}
.cnode{display:flex;flex-direction:column;align-items:center;gap:5px;flex:0 0 auto;width:56px}
.cdot{width:11px;height:11px;border-radius:50%;background:var(--s3-bg);border:1.5px solid var(--line-3);position:relative}
.cdot.done{background:var(--accent);border-color:var(--accent)}
.cdot.now{background:var(--accent);border-color:transparent;box-shadow:0 0 0 4px var(--accent-wash);animation:pp 2.4s var(--e-out) infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 var(--accent-wash)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 8px transparent}}
.cn{font-size:var(--t-m);color:var(--tx3);white-space:nowrap}
.cn.now{color:var(--accent);font-weight:600}
.cdot.brk::after{content:'';position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;background:var(--danger);border:1.5px solid var(--s1-bg)}
.cseg{flex:1;height:2px;background:var(--line);min-width:10px;position:relative;top:-9px}
.cseg.on{background:var(--accent)}
.cnote{margin-top:10px;padding:9px 11px;border-radius:var(--r-sm);background:var(--warn-wash);font-size:var(--t-c);line-height:18px;color:var(--tx2);display:flex;gap:7px}
.cnote svg{width:14px;height:14px;flex:0 0 auto;color:var(--warn);margin-top:2px}
.cnote b{color:var(--tx1);font-weight:600}

/* ── 平铺表 ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:var(--t-m);color:var(--tx4);font-weight:500;text-align:left;padding:0 8px 7px;border-bottom:1px solid var(--line);letter-spacing:.06em;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td{padding:0 8px;height:34px;border-bottom:1px solid var(--line);font-size:var(--t-b);color:var(--tx1);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr{cursor:pointer;transition:background var(--t-hv) var(--e-out)}
.tbl tbody tr:hover{background:var(--s2-bg)}
.pbar{display:flex;align-items:center;gap:7px}
.pbar .pt{width:64px;height:5px;border-radius:5px;background:var(--inset);overflow:hidden;flex:0 0 auto}
.pbar .pt i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.pbar.dgr .pt i{background:var(--danger)}
.pbar.wrn .pt i{background:var(--warn)}
.pbar .pv{font-family:var(--f-mono);font-size:var(--t-c);color:var(--tx3);width:32px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.stx{font-size:var(--t-c);color:var(--tx3);display:flex;align-items:center;gap:5px}

/* ── 任务行 ── */
.todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.ck{width:17px;height:17px;flex:0 0 auto;border-radius:5px;border:1.5px solid var(--line-3);cursor:pointer;transition:all var(--t-hv) var(--e-sp);background:var(--s1-bg)}
.ck:hover{border-color:var(--accent)}
.ck.on{background:var(--accent);border-color:transparent}
.ck.on::after{content:'';display:block;width:9px;height:5px;border:2px solid var(--bub-user-tx);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.todo .tt{flex:1;min-width:0;font-size:var(--t-b)}
.todo.done .tt{color:var(--tx4);text-decoration:line-through}

/* ── 按钮 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;font-family:inherit;font-size:var(--t-s);font-weight:500;cursor:pointer;white-space:nowrap;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--s1-bg);color:var(--tx1);transition:all var(--t-hv) var(--e-out)}
.btn svg{width:13px;height:13px}
.btn:hover{background:var(--s3-bg);border-color:var(--line-2)}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--bub-user-tx);box-shadow:0 2px 8px rgba(14,140,127,.24)}
.btn.pri:hover{background:var(--accent-hi);transform:translateY(-1px);box-shadow:0 6px 16px rgba(14,140,127,.3)}
.btn.gho{background:transparent;border-color:transparent;color:var(--tx3)}
.btn.gho:hover{background:var(--s3-bg);color:var(--tx1)}
.btn.sm{height:25px;padding:0 9px;font-size:var(--t-c)}
.cv{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px}

/* ── 工作建议弹窗 ── */
.pop{position:absolute;right:16px;bottom:16px;width:330px;z-index:50;background:var(--s1-bg);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--e4);overflow:hidden;animation:popIn var(--t-pn) var(--e-sp) both}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.pop.out{animation:popOut var(--t-pn) var(--e-out) both}
@keyframes popOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
.pop-h{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.pop-h .face{width:24px;height:24px;font-size:9px}
.pop-h .nm{font-size:var(--t-c);color:var(--tx2);font-weight:500}
.pop-h .sp{flex:1}
.pop-x{width:22px;height:22px;border:0;background:transparent;border-radius:var(--r-xs);color:var(--tx4);cursor:pointer;display:grid;place-items:center}
.pop-x:hover{background:var(--s3-bg);color:var(--tx1)}
.pop-x svg{width:12px;height:12px}
.pop-b{padding:8px 12px 12px}
.pop-t{font-size:var(--t-h3);line-height:21px;font-weight:600;margin-bottom:5px;letter-spacing:-.005em}
.pop-e{display:flex;align-items:center;gap:6px;font-size:var(--t-m);color:var(--tx4);margin-bottom:10px;flex-wrap:wrap}
.pop-e b{color:var(--tx3);font-weight:500}
.pop-a{display:flex;gap:7px;align-items:center}
.pop-a .sp{flex:1}
.mtag{display:flex;align-items:center;gap:5px;font-size:var(--t-m);color:var(--focus);background:var(--focus-wash);border-radius:var(--r-xs);padding:4px 7px;margin-bottom:8px}
/* 收起的胶囊 */
.cap{position:absolute;right:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:9px;height:44px;padding:0 8px 0 6px;border-radius:var(--r-full);background:var(--s1-bg);border:1px solid var(--line-2);box-shadow:var(--e3);cursor:pointer;max-width:340px;animation:popIn var(--t-pn) var(--e-sp) both}
.cap:hover{box-shadow:var(--e4);border-color:var(--accent-line)}
.cap .ring{position:absolute;left:3px;top:3px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);opacity:.45;animation:pp 2.6s var(--e-out) infinite;pointer-events:none}
.cap .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cap .c1{font-size:var(--t-m);color:var(--tx3);line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cap .c2{font-size:var(--t-c);color:var(--tx1);font-weight:500;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cap .cg{width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-full);border:0;background:var(--s3-bg);color:var(--tx2);display:grid;place-items:center}
.cap .cg:hover{background:var(--accent);color:var(--bub-user-tx)}
.cap .cg svg{width:13px;height:13px}

/* ══ 常驻区：用户显式钉住的模块，一行紧凑小卡，不占地方 ══ */
.pin{border-bottom:1px solid var(--line);background:var(--s2-bg);padding:9px 14px 11px;flex:0 0 auto}
.pin-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.pin-h .lb{font-size:var(--t-m);letter-spacing:.1em;color:var(--tx4);font-weight:600}
.pin-h .hint{font-size:var(--t-m);color:var(--tx4)}
.pin-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.pin-row::-webkit-scrollbar{height:0}
.ptile{
  flex:0 0 auto;min-width:132px;max-width:190px;text-align:left;cursor:pointer;
  background:var(--s1-bg);border:1px solid var(--line);border-radius:var(--r-md);
  padding:8px 10px;transition:all var(--t-hv) var(--e-out);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:stretch;
}
.ptile>span{display:block}
.ptile:hover{border-color:var(--accent-line);box-shadow:var(--e1)}
.ptile .k{font-size:var(--t-m);color:var(--tx4);line-height:14px;display:flex;align-items:center;gap:4px}
.ptile .k i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.ptile .k i.stale{background:var(--warn)}
.ptile .v{font-size:13px;font-weight:600;line-height:19px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ptile .s{font-size:var(--t-m);color:var(--tx3);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .d{display:none;font-size:var(--t-m);color:var(--tx2);line-height:15px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);max-width:200px;white-space:normal}
.ptile.open .d{display:block}
.ptile .x{position:absolute;top:4px;right:4px;width:17px;height:17px;border:0;border-radius:var(--r-full);background:var(--s3-bg);color:var(--tx3);cursor:pointer;display:none;place-items:center}
.ptile:hover .x{display:grid}
.ptile .x:hover{background:var(--danger);color:#fff}
.ptile .x svg{width:9px;height:9px}
.editmode .ptile{border-style:dashed;padding-right:26px}
.live{width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block;flex:0 0 auto}
.live.b{animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ══ 模块抽屉 ══ */
.drawer{position:absolute;inset:0;background:var(--s1-bg);z-index:30;display:none;flex-direction:column;animation:fadeUp var(--t-pn) var(--e-out) both}
.drawer.on{display:flex}
.dw-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dw-h h3{margin:0;font-size:var(--t-h2);font-weight:600}
.dw-h .sp{flex:1}
.dw-b{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;width:100%;max-width:840px;margin:0 auto}
.dw-g{margin-bottom:18px}
.dw-g > .g{font-size:var(--t-m);letter-spacing:.1em;color:var(--tx4);font-weight:600;margin-bottom:8px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mn{font-size:var(--t-b);font-weight:500;display:flex;align-items:center;gap:6px}
.mrow .mn svg{width:14px;height:14px;color:var(--tx3);flex:0 0 auto}
.mrow .md{font-size:var(--t-m);color:var(--tx3);line-height:15px;margin-top:2px}
.mrow .mt{font-size:var(--t-m);color:var(--tx4);font-family:var(--f-mono);margin-top:2px}
.mrow .ms{display:flex;gap:5px;flex:0 0 auto}
.pin-on{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-m);color:var(--accent);background:var(--accent-wash);padding:3px 7px;border-radius:var(--r-full);font-weight:500}

/* ══ 演示标签 ══ */
.dl{font-size:var(--t-m);letter-spacing:.1em;color:var(--tx4);font-weight:600;align-self:center;margin-right:2px}
.dl-s::before{content:'';display:inline-block;width:1px;height:16px;background:var(--line-2);margin-right:12px;vertical-align:-3px}

/* ══ 弹窗语气：不同信号用不同色，一眼分清 ══ */
.pop.tone-work{border-top:2px solid var(--warn)}
.pop.tone-music{border-top:2px solid var(--focus)}
.pop.tone-macro{border-top:2px solid var(--aura)}
.pop.tone-meet{border-top:2px solid var(--ok)}
.pop .pop-lb{font-size:var(--t-m);color:var(--tx4)}
.pop.tone-work .pop-lb{color:var(--warn)}
.pop.tone-music .pop-lb{color:var(--focus)}
.pop.tone-macro .pop-lb{color:var(--ai-2)}
.pop.tone-meet .pop-lb{color:var(--ok)}
.cap.tone-music .ring{border-color:var(--focus)}
.cap.tone-macro .ring{border-color:var(--ai-2)}
.cap.tone-meet .ring{border-color:var(--ok)}

/* ══ 音乐卡 ══ */
.np{display:flex;align-items:center;gap:11px;padding:11px;border-radius:var(--r-md);background:var(--s2-bg);border:1px solid var(--line);margin-bottom:11px}
.np-art{width:42px;height:42px;flex:0 0 auto;border-radius:var(--r-sm);background:linear-gradient(140deg,var(--focus),var(--ai-2));display:grid;place-items:center;color:#fff;box-shadow:var(--e1)}
.np-art svg{width:19px;height:19px}
.np-t{font-size:14px;font-weight:600;line-height:20px}
.np-a{font-size:var(--t-c);color:var(--tx3);margin-top:1px}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;flex:0 0 auto}
.eq i{width:2.5px;background:var(--focus);border-radius:2px;animation:eq 900ms ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.24s}
.eq i:nth-child(4){animation-delay:.36s}.eq i:nth-child(5){animation-delay:.48s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* ══ 快捷操作卡：步骤 × 次数 ══ */
.seq{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:11px}
.step{flex:1 1 0;min-width:84px;position:relative;padding:9px 10px;background:var(--s2-bg);border:1px solid var(--line)}
.step:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.step:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.step+.step{border-left:0}
.step .sn{font-size:var(--t-m);color:var(--tx4);font-family:var(--f-mono)}
.step .sv{font-size:var(--t-c);color:var(--tx1);line-height:16px;margin-top:2px;font-weight:500}
.step .sr{position:absolute;top:-7px;right:6px;font-size:9px;font-family:var(--f-mono);color:var(--ai-2);background:var(--s1-bg);border:1px solid var(--line);border-radius:var(--r-full);padding:1px 5px;font-weight:600}
.seqflow{display:flex;align-items:center;gap:5px;font-size:var(--t-c);color:var(--tx3);margin-bottom:11px}
.seqflow b{color:var(--tx1);font-weight:600}
.chipmini{font-size:var(--t-m);color:var(--tx4);background:var(--s3-bg);border-radius:var(--r-xs);padding:2px 6px;white-space:nowrap}

/* ══ 会议转录卡 ══ */
.ts{display:flex;flex-direction:column;gap:0;margin-bottom:11px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.ts-r{display:flex;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:var(--t-c);line-height:18px;background:var(--s2-bg)}
.ts-r:last-child{border-bottom:0}
.ts-r .tm{font-family:var(--f-mono);font-size:var(--t-m);color:var(--tx4);flex:0 0 38px}
.ts-r .tw{color:var(--tx3);flex:0 0 46px}
.ts-r .tx{color:var(--tx2);flex:1;min-width:0}
.ts-r .tx em{font-style:normal;background:var(--accent-wash);color:var(--accent);padding:0 3px;border-radius:3px;font-weight:500}
.decide{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.decide:last-child{border-bottom:0}
.decide .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:6px;flex:0 0 auto}
.decide .dt{font-size:var(--t-b);line-height:19px;flex:1}
.decide .dt b{font-weight:600}
.decide .dact{display:flex;gap:5px;flex:0 0 auto}

/* ══ 信号源状态（抽屉顶部） ══ */
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:8px;margin-bottom:20px}
.sigb{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 11px;background:var(--s2-bg)}
.sigb .sh{display:flex;align-items:center;gap:6px;font-size:var(--t-c);font-weight:600;margin-bottom:3px}
.sigb .sh i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.sigb .sh i.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-wash)}
.sigb .sh i.off{background:var(--tx4)}
.sigb .sd{font-size:var(--t-m);color:var(--tx4);line-height:15px}
.sigb .sl{font-size:var(--t-m);color:var(--tx3);margin-top:4px}

/* ══ 实时状态条：正在跑的东西，一眼可见 ══ */
.livebar{border-bottom:1px solid var(--line);background:var(--s2-bg);padding:7px 14px;display:none;flex:0 0 auto}
.livebar.on{display:block}
.lb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lb-i{display:flex;align-items:center;gap:6px;font-size:var(--t-c);color:var(--tx1);background:var(--s1-bg);border:1px solid var(--line);border-radius:var(--r-full);padding:3px 9px 3px 7px}
.lb-i .t{font-family:var(--f-mono);font-size:10px;color:var(--tx3)}
.lb-i .w{font-size:var(--t-m);color:var(--tx4)}
.spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-3);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.lbbar{flex:1;min-width:60px;height:3px;border-radius:3px;background:var(--inset);overflow:hidden;position:relative}
.lbbar i{position:absolute;inset:0;width:38%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.4s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(360%)}}
.lb-tip{font-size:var(--t-m);color:var(--tx4)}

/* ══ AI 会话卡：改了哪些文件最重要 ══ */
.dif{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:11px}
.dif-r{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:var(--t-c);background:var(--s2-bg)}
.dif-r:last-child{border-bottom:0}
.dif-r .fn{font-family:var(--f-mono);font-size:10px;color:var(--tx1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.dif-r .ad{font-family:var(--f-mono);font-size:10px;color:var(--ok);flex:0 0 auto}
.dif-r .rm{font-family:var(--f-mono);font-size:10px;color:var(--danger);flex:0 0 auto;margin-left:4px}
.quote{border-left:2px solid var(--line-2);padding:2px 0 2px 10px;font-size:var(--t-c);line-height:18px;color:var(--tx2);margin-bottom:11px}
.pop.tone-ai{border-top:2px solid var(--ai-2)}
.pop.tone-ai .pop-lb{color:var(--ai-2)}
.cap.tone-ai .ring{border-color:var(--ai-2)}

/* ══ 桌面：正在发生什么（一个卡片里装所有控制） ══ */
.prow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:0}
.pw-i{width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--s3-bg);color:var(--tx2)}
.pw-i svg{width:14px;height:14px}
.pw-i.run{background:var(--accent-wash);color:var(--accent)}
.pw-i.ai{background:rgba(139,92,246,.13);color:var(--ai-2)}
.pw-i.mu{background:var(--focus-wash);color:var(--focus)}
.pw-i.me{background:var(--ok-wash);color:var(--ok)}
.pw-b{flex:1;min-width:0}
.pw-t{font-size:var(--t-b);font-weight:500;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-s{font-size:var(--t-m);color:var(--tx3);line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-s .mono{color:var(--tx4)}
.pw-a{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.pw-pin{width:24px;height:24px;border-radius:var(--r-xs);border:0;background:transparent;color:var(--tx4);cursor:pointer;display:grid;place-items:center;transition:all var(--t-hv) var(--e-sp)}
.pw-pin:hover{color:var(--accent);background:var(--accent-wash)}
.pw-pin.on{color:var(--accent)}
.pw-pin svg{width:13px;height:13px}
.pw-pin.on svg{fill:currentColor}

/* 音乐走带 */
.tp{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.tp button{width:26px;height:26px;border:0;background:transparent;border-radius:var(--r-xs);color:var(--tx2);cursor:pointer;display:grid;place-items:center;transition:all var(--t-hv) var(--e-out)}
.tp button:hover{background:var(--s3-bg);color:var(--tx1)}
.tp button.pri{background:var(--focus-wash);color:var(--focus)}
.tp button svg{width:13px;height:13px}
.vol{display:flex;align-items:center;gap:5px;flex:0 0 auto;color:var(--tx3)}
.vol svg{width:12px;height:12px}
.vol .vt{width:48px;height:3px;border-radius:3px;background:var(--inset);overflow:hidden}
.vol .vt i{display:block;height:100%;background:var(--tx3);border-radius:3px}
.vol.cur svg{color:var(--focus)}

/* 派活 */
.dispatch{border:1px solid var(--line);border-radius:var(--r-md);background:var(--s2-bg);padding:11px;margin-bottom:11px}
.dp-t{font-size:13px;line-height:20px;color:var(--tx1);margin-bottom:7px}
.dp-t b{font-weight:600}
.dp-s{display:flex;align-items:center;gap:6px;font-size:var(--t-m);color:var(--tx3);margin-bottom:8px}
.dp-s .mono{color:var(--tx4)}
.dp-steps{display:flex;flex-direction:column;gap:4px}
.dp-x{display:flex;align-items:center;gap:7px;font-size:var(--t-c);color:var(--tx4)}
.dp-x.ok{color:var(--tx2)}
.dp-x .mk{width:12px;height:12px;flex:0 0 auto;display:grid;place-items:center}
.dp-x .mk svg{width:11px;height:11px}
.dp-x.now{color:var(--accent)}
.dp-x.now .mk{animation:spin 1s linear infinite}
.dp-cmd{font-family:var(--f-mono);font-size:10px;color:var(--tx4);background:var(--inset);border:1px solid var(--line);border-radius:var(--r-xs);padding:6px 8px;margin-top:8px;line-height:15px;word-break:break-all}

/* ══ 接管：问一次，然后记住 ══ */
.pop.tone-take{border-top:2px solid var(--focus)}
.pop.tone-take .pop-lb{color:var(--focus)}
.cap.tone-take .ring{border-color:var(--focus)}

.app{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.app:last-child{border-bottom:0}
.ap-i{width:28px;height:28px;flex:0 0 auto;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--s3-bg);color:var(--tx2)}
.ap-i svg{width:15px;height:15px}
.ap-i.ok{background:var(--accent-wash);color:var(--accent)}
.ap-i.off{background:var(--inset);color:var(--tx4)}
.ap-b{flex:1;min-width:0}
.ap-n{font-size:var(--t-b);font-weight:500;line-height:18px;display:flex;align-items:center;gap:6px}
.ap-s{font-size:var(--t-m);color:var(--tx3);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-a{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.take{font-size:var(--t-m);color:var(--tx4);background:var(--s3-bg);border-radius:var(--r-full);padding:2px 7px;font-weight:500}
.take.on{background:var(--accent-wash);color:var(--accent)}
.take.off{color:var(--tx4)}
.note-ok{font-size:var(--t-m);color:var(--ok);display:flex;align-items:center;gap:5px;margin-top:10px;line-height:16px}
.note-ok svg{width:12px;height:12px;flex:0 0 auto}

/* ══ 消息收件箱：通知摘要 + 双击跳转 ══ */
.mlist{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.mi{border:1px solid var(--line);border-radius:var(--r-md);background:var(--s2-bg);padding:9px 10px;cursor:pointer;transition:all var(--t-hv) var(--e-out)}
.mi:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.mi:active{transform:scale(.995)}
.mi-h{display:flex;align-items:baseline;gap:7px;margin-bottom:3px}
.mi-who{font-size:var(--t-b);font-weight:600;color:var(--tx1)}
.mi-app{font-size:var(--t-m);color:var(--tx3);background:var(--s3-bg);border-radius:var(--r-xs);padding:1px 5px}
.mi-tm{margin-left:auto;font-size:var(--t-m);color:var(--tx4)}
.mi-bd{font-size:var(--t-c);line-height:18px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mi-a{display:flex;align-items:center;gap:5px;margin-top:7px}
.mi-hint{font-size:var(--t-m);color:var(--tx4);display:flex;align-items:center;gap:5px;line-height:16px;margin-bottom:10px}
.mi-hint kbd{font-family:var(--f-mono);font-size:9px;background:var(--s3-bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px}

/* ══ computer use：观察 → 计划 → 执行 ══ */
.loop{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:11px}
.lp{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--s2-bg);font-size:var(--t-c);line-height:17px}
.lp:nth-child(even){background:var(--s1-bg)}
.lp .no{width:16px;height:16px;flex:0 0 auto;border-radius:50%;background:var(--s3-bg);color:var(--tx3);display:grid;place-items:center;font-size:9px;font-family:var(--f-mono)}
.lp.ok .no{background:var(--ok-wash);color:var(--ok)}
.lp.run .no{background:var(--accent);color:var(--bub-user-tx);animation:spin 1s linear infinite;border-radius:50%}
.lp.ok .no::after{content:''}
.lp .t1{width:28px;flex:0 0 auto;color:var(--tx2);font-weight:500}
.lp .t2{flex:1;min-width:0;color:var(--tx2)}
.lp .t2 code{font-family:var(--f-mono);font-size:10px;color:var(--tx4)}
.lp .t3{flex:0 0 auto;font-family:var(--f-mono);font-size:9px;color:var(--tx4)}

/* 安全闸 */
.gate{border:1px solid var(--warn);background:var(--warn-wash);border-radius:var(--r-md);padding:11px;margin-bottom:11px}
.gate .gt{font-size:13px;font-weight:600;line-height:19px;color:var(--tx1);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.gate .gt svg{width:14px;height:14px;color:var(--warn);flex:0 0 auto}
.gate .gd{font-size:var(--t-c);line-height:18px;color:var(--tx2);margin-bottom:9px}

/* 学会了的快路径 */
.fast{border:1px solid var(--accent-line);background:var(--accent-wash);border-radius:var(--r-md);padding:11px;margin-bottom:11px}
.fast .ft{font-size:13px;font-weight:600;line-height:19px;margin-bottom:6px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.fast .ft svg{width:14px;height:14px;flex:0 0 auto}
.fast .fm{font-family:var(--f-mono);font-size:10px;color:var(--tx2);background:var(--s1-bg);border:1px solid var(--line);border-radius:var(--r-xs);padding:5px 7px;line-height:15px;margin-bottom:7px;word-break:break-all}
.fast .cmp{display:flex;align-items:center;gap:10px;font-size:var(--t-c);color:var(--tx2)}
.fast .cmp b{font-family:var(--f-mono);color:var(--ok);font-weight:600}

@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
@media (max-width:1080px){
  .split{grid-template-columns:1fr;grid-template-rows:minmax(300px,1fr) minmax(300px,1fr)}
  .chat{border-right:0;border-bottom:1px solid var(--line)}
  .pop,.cap{width:auto;left:16px;right:16px;max-width:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div>
      <h1>WorkOn v9 · 对话即界面</h1>
      <p>没有侧栏，没有首页。左边是姵儿，右边是<strong>对话聊出来的卡片</strong>。第一次打开面板是空的——说一句你要什么，它就长出什么。</p>
    </div>
    <div class="tools">
      <span class="dl">演示场景</span>
      <button class="btn sm" id="popBtn">

      <button class="btn sm" id="macroBtn">

      </button>
      <button class="btn sm" id="meetBtn">

      <button class="btn sm" id="aiBtn">

        AI 写完了
      </button>
      <button class="btn sm" id="dispatchBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
        派个活
      </button>
      <button class="btn sm" id="takeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        要接管吗
      </button>
      <button class="btn sm" id="msgBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
        微信来消息
      </button>
      <button class="btn sm" id="cuaBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
        电脑操作
      </button>
      <span class="dl dl-s"></span>
      <button class="btn sm" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        回到第一次打开
      </button>
      <button class="btn sm" id="modeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="modeIcon"></svg>
        <span id="modeTx">深色</span>
      </button>
    </div>
  </div>

  <div class="win" id="win">
    <!-- 极简顶栏 -->
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg></div>
      <div class="brand"><b>姵儿</b><span>WorkOn</span></div>
      <div class="sp"></div>
      <div class="tdate"><b>9 月 29 日</b> 周二 15:34</div>
      <button class="ib" title="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ib" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1A7 7 0 0 0 14.5 5L14 2.5h-4L9.5 5a7 7 0 0 0-2.1 1.1l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.4 2.3-1A7 7 0 0 0 10 18.6l.5 2.4h4l.5-2.4a7 7 0 0 0 2.1-1.1l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2"/></svg></button>
      <button class="ib cl" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <div class="split">
      <!-- ═══ 对话 ═══ -->
      <div class="chat">
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <div class="cbox">
            <textarea id="inp" rows="1" placeholder="今天要做什么？"></textarea>
            <button class="send" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
          <div class="quick" id="quick"></div>
        </div>
      </div>

      <!-- ═══ 面板 ═══ -->
      <div class="panel">
        <div class="pin" id="pin"></div>
        <div class="livebar" id="livebar"></div>
        <div class="tabs" id="tabs"></div>
        <div class="chips" id="chips"></div>
        <div class="cards" id="cards"></div>
        <div class="drawer" id="drawer"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══ 图标 ═══ */
const I={
  spark:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/>',

  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',

  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1"/>',
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',

  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  inbox2:'<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M3 8l3-4h12l3 4"/><path d="M9 12h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7"/><circle cx="12" cy="12" r="3"/>',

const ic=(n,s)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'+(s?' style="width:'+s+'px;height:'+s+'px"':'')+'>'+I[n]+'</svg>';

/* ═══ 卡片工厂 ═══ */
const LBL={ trace:['留痕','我看懂的那条规矩','trace'], method:['方法','做法的通用部分','method'],
  suggest:['建议','今天可以做的','suggest'], chain:['链路','你现在在哪','route'],
  todo:['待办','今天这几件','list'], project:['项目','全部在推的','folder'], focus:['专注','今天的分心','wave'],
  music:['音乐','我注意到你在听','music'], macro:['快捷操作','你重复做的事','macro'],
  meeting:['会议','刚刚结束的','meeting'], aidev:['AI 会话','它写完了','aidev'],
  desk:['桌面','正在发生什么','desk'], job:['派活','我交出去的活','job'],

const C={
  chain(){ return {type:'chain',title:'DWS 接口开发',body:
    '<div class="chain">'+
      '<div class="cnode"><span class="cdot done"></span><span class="cn">读需求</span></div><div class="cseg on"></div>'+

    '<div class="cv"><button class="btn sm pri" onclick="toast(\'已加入每天 09:15 预热\')">每天 09:15 预热</button>'+

  project(){ return {type:'project',title:'',body:
    '<table class="tbl"><thead><tr><th>项目</th><th>今日</th><th>进度</th><th>状态</th></tr></thead><tbody>'+
    '<tr><td>DWS 接口开发</td><td class="num" style="color:var(--tx3)">0/4</td>'+
      '<td><span class="pbar dgr"><span class="pt"><i style="width:10%"></i></span><span class="pv">10%</span></span></td>'+
      '<td><span class="stx"><i class="dot" style="background:var(--danger)"></i>逾期 2 天</span></td></tr>'+
    '<tr><td>WorkOn</td><td class="num" style="color:var(--tx3)">1/7</td>'+
      '<td><span class="pbar"><span class="pt"><i style="width:43%"></i></span><span class="pv">43%</span></span></td>'+
      '<td><span class="stx"><i class="dot" style="background:var(--accent)"></i>进行中</span></td></tr>'+
    '<tr><td>Oner</td><td class="num" style="color:var(--tx3)">0/6</td>'+
      '<td><span class="pbar"><span class="pt"><i style="width:32%"></i></span><span class="pv">32%</span></span></td>'+
      '<td><span class="stx"><i class="dot" style="background:var(--focus)"></i>需求变了</span></td></tr>'+
    '<tr><td>OnDesign</td><td class="num" style="color:var(--tx4)">—</td>'+
      '<td><span class="pbar"><span class="pt"><i style="width:0%"></i></span><span class="pv">—</span></span></td>'+
      '<td><span class="stx"><i class="dot" style="background:var(--tx4)"></i>未拆任务</span></td></tr>'+
    '<tr><td>OnKnow</td><td class="num" style="color:var(--tx4)">—</td>'+
      '<td><span class="pbar wrn"><span class="pt"><i style="width:6%"></i></span><span class="pv">6%</span></span></td>'+
      '<td><span class="stx"><i class="dot" style="background:var(--warn)"></i>3 天没动</span></td></tr>'+
    '</tbody></table>'}; },

  todo(){ return {type:'todo',title:'',body:

/* ══ 统一刷新调度：替换各组件各开各的 setInterval ══ */
const Clock={
  t:new Map(), inflight:new Set(), stale:new Set(),
  on(key, load){
    const m=M_BY_K[key]; if(!m) return;
    if(!m.ms){ void this.once(key,load); return; }          // 0 = 挂载算一次
    if(this.t.has(key)) return;
    const tick=async()=>{
      if(this.inflight.has(key)) return;                      // ① 防重入
      if(document.hidden) return;                             // ② 后台不刷
      this.inflight.add(key);
      try{ setLive(key, await load()); }
      catch{ this.stale.add(key); paintStale(key); }          // ④ 失败不清空，只标过期
      finally{ this.inflight.delete(key); }
    };
    this.t.set(key,setInterval(tick,m.ms));
    void tick();                                              // 立即拉一次
  },
  async once(key,load){ try{ setLive(key, await load()); }catch{ this.stale.add(key); paintStale(key) } }
};

/* ③ 只有值真的变了才动 DOM：定点改一个文本节点，不重建整条常驻区。
   （重建会让正在 hover / 聚焦的模块消失，是真实的体验 bug） */
function setLive(k, v){
  if (Live[k] === v) return false
  Live[k] = v
  const el = document.querySelector('[data-pin="'+k+'"] .v')
  if (el) el.textContent = v
  return true
}
function paintStale(k){
  const el = document.querySelector('[data-pin="'+k+'"] .k')
  if (el) el.innerHTML = '<i class="stale"></i>'+M_BY_K[k].n+' · 数据过期'
}

  let list = S.cards.filter(c=>inTab(c));
  if(S.filter!=='all') list = list.filter(c=>catOf(c)===S.filter);
  document.getElementById('chips').style.display = S.cards.length? 'flex':'none';
  document.getElementById('chips').innerHTML = FILTERS.map(f=>
    '<button class="chip'+(S.filter===f.k?' on':'')+'" onclick="setFilter(\''+f.k+'\')">'+f.n+'</button>').join('');

  const box=document.getElementById('cards');
  paintPin();
  if(!S.cards.length){ box.innerHTML = emptyState(); return; }
  if(!list.length){ box.innerHTML='<div class="empty" style="min-height:180px"><h3 style="font-size:15px">这一类还没有</h3><p>跟姵儿提一句，它会补上。</p></div>'; return; }
  box.innerHTML = list.map(c=>cardHTML(c)).join('');
}

function emptyState(){
  const seeds=[['folder','我的项目进度'],['list','今天有哪些待办'],['route','我现在在哪个链路'],['wave','我今天专注怎么样']];
  return '<div class="empty">'+
    '<div class="orb">'+ic('spark',24)+'</div>'+
    '<h3>这里还什么都没有</h3>'+
    '<p>跟姵儿说一句话，需要什么它就摆什么。<br>不会一次给你 12 个板块。</p>'+
    '<div class="grow">'+seeds.map(s=>'<button class="gc" onclick="ask(\''+s[1]+'\')">'+ic(s[0],15)+s[1]+'</button>').join('')+'</div>'+
  '</div>';
}

const CARD_ICON={chain:'route',todo:'list',project:'folder',focus:'wave',suggest:'spark',trace:'book',method:'layers',
  music:'music',macro:'zap',meeting:'video',aidev:'brain',desk:'grid',job:'send',apps:'lock',inbox:'mail',cua:'compass'};

function cardHTML(c){
  const L=LBL[c.type];
  let body=c.body;
  if(c.title) body = '<h4 class="ct">'+c.title+'</h4>' + body;
  return '<div class="card" id="card-'+c.id+'">'+
    '<div class="c-h"><span class="ci '+L[2]+'">'+ic(CARD_ICON[c.type],13)+'</span>'+
    '<span class="lbl"><b'+(L[2]==='method'?' class="fm"':'')+'>'+L[0]+'</b> · '+L[1]+'</span></div>'+
    '<div class="c-b">'+body+'</div></div>';
}

/* ═══ 行为 ═══ */
const setTab=t=>{S.tab=t;renderPanel()};
const setFilter=f=>{S.filter=f;renderPanel()};

function push(who,text,born){ S.msg.push({who,text,born}); renderChat(); }

function addCards(defs,born){
  // 同类卡片刷新而非堆叠：面板里同一种永远只有一张
  const made=defs.map(d=>{ const o=d(); return {id:'c'+(++S.cid), type:o.type, title:o.title||'', body:o.body, cat:o.cat}; });
  made.forEach(m=>{ S.cards = S.cards.filter(c=>c.type!==m.type); });
  S.cards = S.cards.concat(made);
  renderPanel();
  if(made.length){
    setTimeout(()=>{
      made.forEach(m=>{ const el=document.getElementById('card-'+m.id); if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1400); } });
    },60);
  }
  return made.map(m=>({n:LBL[m.type][0],id:m.id}));
}

function ask(text){
  if(!text.trim()) return;
  push('u', text.replace(/</g,'&lt;'));
  S.msg.push({think:true}); renderChat();
  setTimeout(()=>{ S.msg=S.msg.filter(m=>!m.think); reply(text); }, 700);
}

function reply(t){
  const has=k=>new RegExp(k).test(t);
  const defs=[]; let said='';

  if(has('项目|进度|接口|dws|workon|代码|开发|联调|oner|onknow|ondesign|推进')){
    defs.push(C.project); said='先把所有在推的项目摊平给你看，逾期和没动的排在前面。';
  }
  if(has('链路|卡住|断|下一步|在哪|写到哪')){ defs.push(C.chain); said=(said?' ':'')+'你现在卡在「自测」这一步，我把断点标出来了。'; }
  if(has('待办|任务|要做|排一下|安排|今天')){ defs.push(C.todo); said=(said?' ':'')+'今天这几件已经按时间排好了。'; }
  if(has('习惯|总是|每次|以后|别再|希望|记住|不要')){ defs.push(C.trace); said=(said?' ':'')+'我听到一条你的规矩，先记下来，以后照着来。'; }
  if(has('方法|怎么|经验|怎么办|教我|总结')){ defs.push(C.method); said=(said?' ':'')+'你这件事有个通用规律，我拆出来了。'; }
  if(has('摸鱼|分心|专注|效率|状态|打断')){ defs.push(C.focus); said=(said?' ':'')+'今天的分心我统计了一下。'; }
  if(has('歌|听歌|音乐|qq音乐|网易云|播放')){ defs.push(C.music); said=(said?' ':'')+'我注意到你在听，已经记下来了。'; }
  if(has('快捷|重复|操作|流程|做了几次|老是')){ defs.push(C.macro); said=(said?' ':'')+'你刚才那串操作重复了 3 次，我给你记下了。'; }
  if(has('会议|转录|录音|纪要|腾讯会议|开会')){ defs.push(C.meeting); said=(said?' ':'')+'会议已经转录完，摘出了 3 个决定。'; }
  if(has('ai|claude|codex|cursor|写完了|ai 写|trae|codebuddy')){ defs.push(C.aidev); said=(said?' ':'')+'Claude Code 2 分钟前改完了，改了 3 个文件。'; }
  if(has('桌面|进程|在跑|音乐控制|暂停|下一首|派个活|派活|调度')){ defs.push(C.desk); said=(said?' ':'')+'桌面上在跑的东西我给你摊在这了，能直接控制。'; }
  if(has('接管|控制权|能不能管|能控制|授权')){ defs.push(C.apps); said=(said?' ':'')+'接管这件事我得你点头。逐个应用你来定，我不会自己去拿。'; }
  if(has('消息|微信|来信|未读|通知|回消息|飞书|企微|企业微信')){ defs.push(C.inbox); said=(said?' ':'')+'3 条新消息。双击任意一条我直接把你切过去。'; }
  if(has('电脑操作|接管电脑|操作界面|点按钮|自己看屏幕|自动化操作|computer')){ defs.push(C.cua); said=(said?' ':'')+'这个界面我没学过，所以我直接看屏幕点。走完我记住，下次就不用看了。'; }
  if(!defs.length){ defs.push(C.suggest); said='这个我先给你一组现成的，用不上的你直接删。'; }

  const made = S.cards.length ? [] : [];
  const born = addCards(defs);
  push('b', said, born);
  setQuick();
}

/* ═══ 快捷短语 ═══ */
const QUICKS=[
  ['我的项目进度怎么样','项目|进度'],['我现在卡在哪一步','链路|卡住'],
  ['今天有哪些待办','待办|今天'],['我今天专注怎么样','摸鱼|专注'],
  ['我在听什么歌','听歌|音乐'],['我刚才是不是重复操作了','重复|操作'],
  ['刚才的会议说了什么','会议|转录'],['AI 写完了吗','ai|写完了'],

/* ═══ 首次引导 ═══ */
/* ══ 演示用的取数：真实实现接 IPC，这里模拟「数据在变」 ══ */
const APPS=['DevTool · 写接口','electron · 自测','Slack · 联调对齐','微信 · 划水中','SSH · 看日志'];
let tsec=0, tslack=0;
function startClock(){
  Clock.t.forEach(t=>clearInterval(t)); Clock.t.clear(); Clock.inflight.clear(); Clock.stale.clear();
  Clock.on('presence', async()=>{ tsec+=2; return APPS[Math.floor(tsec/8)%APPS.length]; });
  Clock.on('attention', async()=>{ return '最长 '+Math.min(52,38+Math.floor(tsec/30))+'m · 打断 '+(5+Math.floor(tsec/60))+' 次'; });
  Clock.on('dist',      async()=>{ tslack+=1; return '摸鱼 '+Math.min(24,11+Math.floor(tslack/6))+'m'; });
  Clock.on('dayplan',   async()=>'3/7 · 43%');
  Clock.on('weather',   async()=>'26° 雨');
  Clock.on('chain',     async()=>'DWS · 断在自测');
  Clock.on('quote',     async()=>'今天第 42 句');
  Clock.on('storage',   async()=>(180+Math.floor(tslack/4))+' MB');
  paintPin();
}

function boot(){
  const keepMode=S.mode;
  S={tab:'today',filter:'all',cards:[],msg:[],cid:0};
  if(keepMode) S.mode=keepMode;
  S.msg.push({who:'b',text:'我是姵儿。就住在你桌面上，看得到你什么时候在写代码、什么时候在划水——不是为了管你，是为了你卡住的时候递一把。'});
  S.msg.push({who:'b',text:'先不给你任何看板。<em>说说你今天要做什么</em>，剩下的我来摆。'});
  renderChat(); renderPanel(); setQuick();
  document.getElementById('inp').placeholder='今天要做什么？';
  clearTimeout(popTimer); clearTimeout(capTimer);
  document.querySelectorAll('.pop,.cap').forEach(e=>e.remove());
  startClock();
  setTimeout(showPop, 1500);
}

/* ═══ 工作建议弹窗 ═══ */
/* ═══ 弹窗：4 种语气，同一套交互（5s 收胶囊 / 不叠加 / 关掉有冷却） ═══ */
const POPS={
  work:{tone:'work',lb:'工作建议',t:'DWS 接口逾期 2 天，今天只推进了 10%',
    ev:['逾期 2 天','今日 10%','联调卡住'],
    acts:[['排到明早 09:30','pri'],['先不管','']],mute:'别再提醒',q:'要排到明早 09:30 吗',ok:'已排到明早 09:30',card:null},
  music:{tone:'music',lb:'音乐',t:'《雨天》已经连着放了 34 分钟',
    ev:['QQ音乐 · 南拳妈妈','今天第 2 段','这期间无窗口切换'],
    acts:[['记进今天','pri'],['专注时暂停','']],mute:'别再提',q:'要记进今天吗',ok:'已记进今天',card:'music'},
  macro:{tone:'macro',lb:'快捷操作',t:'你刚把同一串操作做了 3 次',
    ev:['新建待办','绑定 DWS','排到 09:30'],
    acts:[['固化成一句话','pri'],['先不用','']],mute:'别记了',q:'要固化成一句话吗',ok:'已固化',card:'macro'},
  meet:{tone:'meet',lb:'会议',t:'腾讯会议 1h12m 已转录，摘出 3 个决定',
    ev:['8 人','你发言 38m','2 条你没记'],
    acts:[['立成待办','pri'],['晚点看','']],mute:'会后别提醒',q:'要把 3 个决定立成待办吗',ok:'已立成待办',card:'meeting'},
  ai:{tone:'ai',lb:'AI 完成',t:'Claude Code 把 winInfo 改完了',
    ev:['2m14s','3 个文件','4.2k out'],
    acts:[['接下一句','pri'],['看 diff','']],mute:'AI 完成别弹',q:'要接下一句吗',ok:'已接上下一句',card:'aidev'},
  take:{tone:'take',lb:'接管请求',t:'我看到你开着 QQ音乐',
    ev:['前台 12m','今天第 3 段','你还没给过我控制权'],
    acts:[['接管音乐控制','pri'],['不管','']],mute:'别再问我',q:'要我接管音乐吗',ok:'已接管音乐控制',card:'apps'}
};
let popKind='work', musicOn=false;
const setMusic=v=>{ musicOn=v; if(!v) document.querySelectorAll('.mtag').forEach(e=>e.remove()) };

function showPop(kind){
  if(document.querySelector('.pop')||document.querySelector('.cap')) return;   // 不叠加
  popKind=kind||'work';
  const P=POPS[popKind];
  // 听歌时：工作建议被延后，但仍然送到（它知道你在，只是不打断）
  const sup = (popKind==='work' && musicOn)
    ? '<div class="mtag">听歌中 · 已延后，深度块结束后一起给你</div>' : '';
  const p=document.createElement('div');
  p.className='pop tone-'+P.tone;
  p.innerHTML='<div class="pop-h"><span class="face">姵</span><span class="pop-lb">姵儿 · '+P.lb+'</span><span class="sp"></span>'+
    '<span style="font-size:10px;color:var(--tx4)">刚刚</span>'+
    '<button class="pop-x" onclick="killPop(1)">'+ic('x',12)+'</button></div>'+
    '<div class="pop-b"><div class="pop-t">'+P.t+'</div>'+sup+
    '<div class="pop-e"><b>依据</b>'+P.ev.map(x=>'<span>· '+x+'</span>').join('')+'</div>'+
    '<div class="pop-a">'+P.acts.map((a,i)=>'<button class="btn sm '+(a[1]==='pri'?'pri':'')+'" onclick="act('+i+')">'+a[0]+'</button>').join('')+
    '<span class="sp"></span><button class="btn sm gho" onclick="killPop(1);toast(\'这类已关，45 分钟内不再出现\')">'+P.mute+'</button></div></div>';
  document.getElementById('win').appendChild(p);
  capTimer=setTimeout(toCap, 5000);
}
function act(i){
  const P=POPS[popKind];
  if(i===1 && popKind==='music') setMusic(false);
  if(P.card){ const m=addCards([C[P.card]])[0]; flashCard(m.id) }
  killPop(0); toast(P.ok);
}
function flashCard(id){ setTimeout(()=>{ const e=document.getElementById('card-'+id); if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1500)} },80) }
function toCap(){
  const p=document.querySelector('.pop'); if(!p) return;
  const P=POPS[popKind];
  p.classList.add('out');
  setTimeout(()=>{
    p.remove();
    const c=document.createElement('div');
    c.className='cap tone-'+P.tone;
    c.innerHTML='<span class="face">姵</span><span class="ring"></span>'+
      '<span class="ct"><span class="c1">姵儿 · '+P.lb+'</span><span class="c2">'+P.q+'</span></span>'+
      '<button class="cg" onclick="event.stopPropagation();act(0)">'+ic('arrow',13)+'</button>'+
      '<button class="cg" onclick="event.stopPropagation();killPop(1)">'+ic('x',13)+'</button>';
    c.addEventListener('click',()=>{ c.remove(); showPop(popKind); });
    document.getElementById('win').appendChild(c);
  },240);
}
function killPop(hide){
  clearTimeout(capTimer);
  const p=document.querySelector('.pop'), c=document.querySelector('.cap');
  if(p) p.remove(); if(c) c.remove();
  if(hide) setTimeout(()=>showPop(popKind), 45000);
}
const fire=k=>{ document.querySelectorAll('.pop,.cap').forEach(e=>e.remove()); clearTimeout(capTimer); setTimeout(()=>showPop(k),120) };
document.getElementById('popBtn').onclick=()=>fire('work');
document.getElementById('musicBtn').onclick=()=>{ setMusic(true); fire('music') };
document.getElementById('macroBtn').onclick=()=>fire('macro');
document.getElementById('meetBtn').onclick=()=>fire('meet');
document.getElementById('resetBtn').onclick=()=>{ boot(); };
window.setMusic=setMusic;

/* ══ 实时反馈：正在跑的 AI 会话，秒级可见 ══ */
let running=null, liveTick=null;
function startRun(tool, what, ms){
  running={tool, what, since:Date.now()};
  paintLive();
  setTimeout(()=>{ running=null; paintLive(); }, ms||10000);
}
function paintLive(){
  const b=document.getElementById('livebar'); if(!b) return;
  clearTimeout(liveTick);
  if(!running){ b.classList.remove('on'); b.innerHTML=''; return }
  const sec=Math.round((Date.now()-running.since)/1000);
  b.classList.add('on');
  b.innerHTML='<div class="lb"><span class="lb-i"><span class="spin"></span>'+esc(running.tool)+
    '<span class="t">'+sec+'s</span></span>'+
    '<span class="lbbar"><i></i></span>'+
    '<span class="lb-tip">'+esc(running.what)+'</span></div>';
  liveTick=setTimeout(paintLive, 1000);
}
document.getElementById('aiBtn').onclick=()=>{
  document.querySelectorAll('.pop,.cap').forEach(e=>e.remove()); clearTimeout(capTimer);
  startRun('Claude Code','正在改 winInfo.ts · 你可以先去做别的', 11000);
  setTimeout(()=>fire('ai'), 11000);
};

/* ══ 派活：WorkOn 当调度台，给 AI 编程工具下指令并等结果 ══ */
const DISPATCH_CMD={claude:'claude -p … --output-format stream-json --add-dir D:\\AI\\WorkOn\\workon',
                    codex:'codex exec … --json -C D:\\AI\\WorkOn\\workon'};
function dispatch(tool){
  const name = tool==='codex' ? 'Codex' : 'Claude Code';
  const ask = tool==='codex' ? '给 winInfo 加个 2 秒节流，Codex 也做一版我要比对'
                              : '给 winInfo 加个 2 秒节流，别动 presence 心跳';
  document.querySelectorAll('.pop,.cap').forEach(e=>e.remove()); clearTimeout(capTimer);
  push('u', ask);
  S.msg.push({think:true}); renderChat();
  setTimeout(()=>{
    S.msg=S.msg.filter(m=>!m.think);
    push('b','已经派给 '+name+' 了。它在 '+DISPATCH_CMD[tool].split(' ')[0]+' 里跑，你不用守着 —— 完了我弹给你。');
    startRun(name, DISPATCH_CMD[tool]+' · 正在读 winInfo.ts', 12000);
    setTimeout(()=>{
      const m=addCards([C.job])[0]; flashCard(m.id);
      POPS.ai.t = name+' 把 winInfo 节流改完了';
      POPS.ai.ev = ['2m14s','3 个文件','4.2k out'];
      showPop('ai');
    }, 12100);
  }, 700);
}
document.getElementById('dispatchBtn').onclick=()=>dispatch('claude');

/* ══ 接管：问一次，然后记住 ══ */
function takeOver(name, btn){
  btn.textContent='已接管'; btn.className='btn sm gho';
  btn.onclick=()=>toast('已收回对 '+name+' 的接管，我立刻停止读取');
  toast('已接管 '+name+' · 写进偏好，以后不再问');
}
document.getElementById('takeBtn').onclick=()=>fire('take');
document.getElementById('msgBtn').onclick=()=>{
  const m=addCards([C.inbox])[0]; flashCard(m.id);
  push('b','3 条新消息。我读的是通知区那点摘要，没碰你的聊天记录。双击任意一条我把你切过去。');
};
document.getElementById('cuaBtn').onclick=()=>{
  const m=addCards([C.cua])[0]; flashCard(m.id);
  push('b','这个界面我没学过，所以我直接看屏幕点。走完我记住，下次就不用看了。');
  toast('已接管键鼠 · Esc 随时停');
};

/* ═══ 输入 ═══ */
const inp=document.getElementById('inp');
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const v=inp.value; inp.value=''; ask(v); }
});
inp.addEventListener('input',()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,88)+'px'; });
document.getElementById('sendBtn').onclick=()=>{ const v=inp.value; inp.value=''; ask(v); };

/* ═══ Toast ═══ */
let tt;
function toast(m){
  const o=document.querySelector('.tw'); if(o)o.remove();
  const d=document.createElement('div');
  d.className='tw'; d.style.cssText='position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:var(--tx1);color:var(--s1-bg);font-size:12px;box-shadow:var(--e3);animation:fadeUp 200ms var(--e-sp) both';
  d.innerHTML='<span style="color:var(--ok);display:flex">'+ic('check',13)+'</span>'+m;
  document.getElementById('win').appendChild(d);
  clearTimeout(tt); tt=setTimeout(()=>d.remove(),2200);
}

/* ═══ 主题 ═══ */
function setMode(){
  document.documentElement.dataset.mode=S.mode||'light';
  document.getElementById('modeIcon').innerHTML = S.mode==='light'?I.moon:I.sun;
  document.getElementById('modeTx').textContent = S.mode==='light'?'深色':'浅色';
}
document.getElementById('modeBtn').onclick=()=>{ S.mode = (S.mode||'light')==='light'?'dark':'light'; setMode(); };

/* ═══ 启动 ═══ */
setMode(); boot();
