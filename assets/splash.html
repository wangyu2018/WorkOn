<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splash · Boot Sequence</title>
  <style>
    :root {
      --bg: #160c06;
      --green: #ffb36b;
      --cyan: #ffd98c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, Consolas, "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }

    #stage {
      position: fixed; inset: 0;
      display: block;
      will-change: transform;
    }

    /* 2D 桌宠立绘（姵儿）：右下角常驻，挥手问候 + 轻微浮动 */
    .peier {
      position: fixed;
      right: 6px;
      bottom: 4px;
      height: 88%;
      width: auto;
      opacity: 0.92;
      filter: drop-shadow(0 0 18px rgba(255, 179, 107, 0.18));
      transition: opacity 0.22s ease;
      pointer-events: none;
      animation: peierFloat 5s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes peierFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* 对话气泡 */
    .bubble {
      position: fixed;
      right: 132px;
      top: 12%;
      max-width: 236px;
      padding: 10px 14px;
      border-radius: 14px 14px 14px 4px;
      border: 1px solid rgba(255, 210, 160, 0.25);
      background: rgba(20, 14, 8, 0.42);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 232, 200, 0.92);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateY(6px);
      pointer-events: none;
      z-index: 3;
    }
    .bubble.show { opacity: 1; transform: translateY(0); }

    /* HUD：状态行 + 进度条 */
    .hud {
      position: fixed;
      left: 34%; bottom: 13%;
      transform: translateX(-50%) translateY(18px);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      pointer-events: none;
    }
    .hud.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .status {
      font-size: 10px;
      letter-spacing: 0.55em;
      text-indent: 0.55em;
      color: rgba(255, 210, 160, 0.72);
      text-shadow: 0 0 12px rgba(255, 179, 107, 0.35);
      white-space: nowrap;
    }
    .status .dim { color: rgba(200, 150, 120, 0.4); }

    .bar-row { display: flex; align-items: center; gap: 16px; }

    .bar {
      width: min(240px, 44vw); height: 2px;
      background: rgba(255, 210, 160, 0.1);
      border-radius: 2px;
      overflow: visible;
      position: relative;
    }
    .bar .fill {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--cyan));
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 179, 107, 0.8), 0 0 26px rgba(255, 217, 140, 0.45);
      transition: width 0.12s linear;
    }
    .bar .fill::after {
      content: "";
      position: absolute; right: -3px; top: 50%;
      width: 8px; height: 8px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #fff3e6;
      box-shadow: 0 0 12px 3px rgba(255, 200, 140, 0.9);
    }
    .pct {
      font-size: 11px;
      min-width: 4ch;
      color: rgba(255, 225, 185, 0.85);
      text-shadow: 0 0 10px rgba(255, 179, 107, 0.4);
      font-variant-numeric: tabular-nums;
    }

    .hint {
      position: fixed;
      left: 34%; bottom: 5.5%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      color: rgba(210, 175, 130, 0.4);
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      animation: hintPulse 2.4s ease-in-out infinite;
    }
    .hint.show { opacity: 1; }
    @keyframes hintPulse {
      0%, 100% { color: rgba(210, 175, 130, 0.28); }
      50% { color: rgba(255, 220, 170, 0.6); }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <img class="peier" id="peier" alt="姵儿" />
  <div class="bubble" id="bubble"><span id="bubbleText">你好呀，我是姵儿！</span></div>

  <div class="hud" id="hud">
    <div class="status" id="status">BOOT SEQUENCE</div>
    <div class="bar-row">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>
  <div class="hint" id="hint">CLICK TO REPLAY</div>

  <script>
/* ============================================================
   SPLASH · Boot Sequence
   粒子汇聚 → 成形充能 → 冲击波 → 加载 → 完成
   ============================================================ */

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const statusEl = document.getElementById("status");
const fillEl = document.getElementById("fill");
const pctEl = document.getElementById("pct");
const hintEl = document.getElementById("hint");

/* ---------- 时间轴（秒） ---------- */
const T = {
  CONVERGE: 0.45,   // 粒子开始汇聚
  LOCK: 3.15,       // 粒子基本就位
  REVEAL: 3.3,      // 图标淡入开始
  REVEAL_END: 4.1,  // 图标完全显现
  SHOCK: 3.92,      // 冲击波
  LOAD: 4.35,       // 加载条开始
  LOAD_END: 6.75,   // 加载完成
  FLASH: 6.78,      // 完成闪光
};

const STATUS_STEPS = [
  [0.0, "BOOT SEQUENCE"],
  [0.28, "LOADING MODULES"],
  [0.62, "CALIBRATING CORE"],
  [0.88, "FINALIZING"],
  [1.0, "READY"],
];

/* ---------- 基础工具 ---------- */
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const easeOutQuint = (x) => 1 - Math.pow(1 - x, 5);
const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = (x) =>
  x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = (x) => x * x * (3 - 2 * x);
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- 画布与布局 ---------- */
let W = 0, H = 0, DPR = 1;
let hazeSprite = null;

function iconSize() {
  return Math.min(W, H) * 0.46;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildHaze();
}

/* 背景光晕 sprite */
function buildHaze() {
  const s = 640;
  hazeSprite = document.createElement("canvas");
  hazeSprite.width = hazeSprite.height = s;
  const c = hazeSprite.getContext("2d");
  let g = c.createRadialGradient(s * 0.5, s * 0.46, 0, s * 0.5, s * 0.46, s * 0.42);
  g.addColorStop(0, "rgba(255, 217, 140, 0.20)");
  g.addColorStop(0.55, "rgba(120, 80, 45, 0.07)");
  g.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = g;
  c.fillRect(0, 0, s, s);
  g = c.createRadialGradient(s * 0.38, s * 0.62, 0, s * 0.38, s * 0.62, s * 0.4);
  g.addColorStop(0, "rgba(255, 179, 107, 0.13)");
  g.addColorStop(1, "rgba(0, 0, 0, 0)");
  c.fillStyle = g;
  c.fillRect(0, 0, s, s);
}

let blurIcon = null;   // 图标的模糊发光版
let targets = [];      // { u, v, r, g, b, col }
let particles = [];

function sampleTargets(count) {
  const S = 300;
  const off = document.createElement("canvas");
  off.width = off.height = S;
  const o = off.getContext("2d");
  o.drawImage(icon, 0, 0, S, S);
  const d = o.getImageData(0, 0, S, S).data;
  const pts = [];
  for (let y = 0; y < S; y += 2) {
    for (let x = 0; x < S; x += 2) {
      const i = (y * S + x) * 4;
      const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
      const lum = 0.3 * r + 0.55 * g + 0.15 * b;
      // 只取荧光笔画上的像素（亮、偏绿/青）
      if (a > 130 && lum > 60 && r > 150 && Math.random() < lum / 255) {
        pts.push({
          u: x / S, v: y / S,
          col: `rgb(${r},${g},${b})`,
          bright: lum / 255,
        });
      }
    }
  }
  // 打乱并限量
  for (let i = pts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [pts[i], pts[j]] = [pts[j], pts[i]];
  }
  return pts.slice(0, count);
}

function buildBlurIcon() {
  const s = icon.width * 1.7;
  blurIcon = document.createElement("canvas");
  blurIcon.width = blurIcon.height = s;
  const c = blurIcon.getContext("2d");
  c.filter = `blur(${Math.round(icon.width * 0.05)}px)`;
  c.drawImage(icon, s * 0.5 - icon.width / 2, s * 0.5 - icon.height / 2);
}

/* ---------- 粒子 ---------- */
function makeParticle(tgt) {
  // 从画面外圆周生成
  const ang = Math.random() * Math.PI * 2;
  const R = Math.hypot(W, H) * rand(0.68, 0.95);
  const cx = W * 0.36, cy = H * 0.46;
  const size = iconSize();
  const tx = cx + (tgt.u - 0.5) * size;
  const ty = cy + (tgt.v - 0.5) * size;
  const sx = cx + Math.cos(ang) * R;
  const sy = cy + Math.sin(ang) * R;
  const len = Math.hypot(tx - sx, ty - sy) || 1;
  return {
    sx, sy, tx, ty,
    col: tgt.col,
    bright: tgt.bright,
    size: rand(0.8, 1.6) + tgt.bright * 1.4,
    delay: rand(0, 1.15),
    dur: rand(1.3, 2.1),
    arc: (Math.random() - 0.5) * len * 0.55,  // 弧线偏移
    tw: rand(1.5, 4),                          // 闪烁频率
    tp: rand(0, Math.PI * 2),                  // 闪烁相位
  };
}

/* ---------- 特效对象 ---------- */
let rings = [];   // 冲击波 { t0, speed, hue }
let arcs = [];    // 电弧 { pts, until }
let flashAt = -1; // 完成闪光时间
let shockDone = false;

function spawnArc() {
  const cx = W * 0.36, cy = H * 0.46, size = iconSize();
  const a = Math.random() * Math.PI * 2;
  const r0 = size * rand(0.38, 0.52);
  const x0 = cx + Math.cos(a) * r0;
  const y0 = cy + Math.sin(a) * r0;
  const x1 = x0 + Math.cos(a) * rand(40, 120) + rand(-30, 30);
  const y1 = y0 + Math.sin(a) * rand(40, 120) + rand(-30, 30);
  const pts = [[x0, y0]];
  const seg = 5 + ((Math.random() * 3) | 0);
  for (let i = 1; i <= seg; i++) {
    const f = i / seg;
    pts.push([
      x0 + (x1 - x0) * f + rand(-14, 14),
      y0 + (y1 - y0) * f + rand(-14, 14),
    ]);
  }
  arcs.push({ pts, until: tNow + rand(0.05, 0.12) });
}

/* ---------- 视差 ---------- */
let mx = 0, my = 0;      // 鼠标目标
let px = 0, py = 0;      // 平滑值
window.addEventListener("pointermove", (e) => {
  mx = (e.clientX / W - 0.5) * 2;
  my = (e.clientY / H - 0.5) * 2;
});

/* ---------- 主循环 ---------- */
let t0 = 0, tNow = 0;
let started = false;
let finished = false;
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function reset() {
  t0 = performance.now();
  rings = [];
  arcs = [];
  flashAt = -1;
  shockDone = false;
  finished = false;
  particles = targets.map(makeParticle);
  hud.classList.remove("show");
  hintEl.classList.remove("show");
  fillEl.style.width = "0%";
  pctEl.textContent = "0%";
  statusEl.textContent = "BOOT SEQUENCE";
  // 清屏（透明背景，去掉上一轮的拖尾）
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
}

window.addEventListener("click", () => {
  if (finished) reset();
});
window.addEventListener("keydown", () => {
  if (finished) reset();
});

function frame(now) {
  requestAnimationFrame(frame);
  tNow = (now - t0) / 1000;
  const t = tNow;
  const cx = W * 0.36, cy = H * 0.46;
  const size = iconSize();

  /* --- 透明背景（无界）：每帧清屏，不做拖尾填充 --- */
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);

  /* --- 背景光晕呼吸 --- */
  const hazeA = 0.55 + 0.2 * Math.sin(t * 0.7);
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = hazeA;
  const hz = Math.max(W, H) * 1.25;
  ctx.drawImage(hazeSprite, cx - hz / 2, cy - hz / 2, hz, hz);
  ctx.globalAlpha = 1;

  /* --- 冲击波触发 --- */
  if (!shockDone && t >= T.SHOCK) {
    shockDone = true;
    rings.push({ t0: t, speed: 1050, col: "255, 179, 107" });
    rings.push({ t0: t + 0.08, speed: 700, col: "255, 217, 140" });
  }

  /* --- 粒子 --- */
  const convergeT = T.LOCK - T.CONVERGE;
  const revealF = smooth(clamp01((t - T.REVEAL) / (T.REVEAL_END - T.REVEAL)));
  ctx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const local = clamp01((t - T.CONVERGE - p.delay) / (convergeT * (p.dur / 2)));
    const e = easeOutQuint(local);
    let x = p.sx + (p.tx - p.sx) * e;
    let y = p.sy + (p.ty - p.sy) * e;
    // 弧线轨迹
    const dx = p.tx - p.sx, dy = p.ty - p.sy;
    const len = Math.hypot(dx, dy) || 1;
    const bulge = Math.sin(e * Math.PI) * p.arc;
    x += (-dy / len) * bulge;
    y += (dx / len) * bulge;
    // 飞行抖动 + 就位后的呼吸微动
    const j = (1 - e) * 3.2 + 0.5;
    x += (Math.random() - 0.5) * j;
    y += (Math.random() - 0.5) * j;

    let a = (0.22 + 0.78 * e) * (0.7 + 0.3 * Math.sin(t * p.tw + p.tp));
    if (local <= 0) a = 0.12;
    a *= 1 - revealF * 0.62; // 图标显现后粒子退为微光

    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    const s = p.size;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  /* --- 图标显现 + 发光 --- */
  if (revealF > 0) {
    const popF = flashAt > 0 ? clamp01(1 - (t - flashAt) / 0.6) : 0;
    const pop = 1 + 0.05 * Math.sin(popF * Math.PI);
    const sc = (1.14 - 0.14 * easeOutCubic(revealF)) * pop;
    const ds = size * sc;

    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = revealF;
    ctx.drawImage(icon, cx - ds / 2, cy - ds / 2, ds, ds);

    // 呼吸光晕
    ctx.globalCompositeOperation = "lighter";
    const breathe = 0.42 + 0.16 * Math.sin(t * 2.2) + popF * 0.5;
    ctx.globalAlpha = revealF * breathe;
    const bs = ds * 1.55;
    ctx.drawImage(blurIcon, cx - bs / 2, cy - bs / 2, bs, bs);
    ctx.globalAlpha = 1;

    // 环绕彗星（两颗，反向）
    for (let k = 0; k < 2; k++) {
      const dir = k === 0 ? 1 : -1;
      const ang = dir * t * (0.85 + k * 0.3) + k * Math.PI * 0.8;
      const rr = size * 0.74;
      const ex = cx + Math.cos(ang) * rr;
      const ey = cy + Math.sin(ang) * rr * 0.96;
      const grad = ctx.createRadialGradient(ex, ey, 0, ex, ey, 9);
      grad.addColorStop(0, k === 0 ? "rgba(255,220,180,0.9)" : "rgba(255,220,150,0.9)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ex, ey, 9, 0, Math.PI * 2);
      ctx.fill();
    }

    // 随机电弧
    if (t < T.LOAD_END && Math.random() < 0.09) spawnArc();
  }

  /* --- 电弧 --- */
  ctx.globalCompositeOperation = "lighter";
  arcs = arcs.filter((a2) => a2.until > t);
  for (const a2 of arcs) {
    ctx.strokeStyle = `rgba(255, 215, 170, ${rand(0.25, 0.6)})`;
    ctx.lineWidth = rand(0.6, 1.4);
    ctx.beginPath();
    a2.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }

  /* --- 冲击波圆环 --- */
  ctx.globalCompositeOperation = "lighter";
  rings = rings.filter((r) => (t - r.t0) * r.speed < Math.hypot(W, H) * 0.75);
  for (const r of rings) {
    const rr = (t - r.t0) * r.speed;
    const maxR = Math.hypot(W, H) * 0.75;
    const a = (1 - rr / maxR) * 0.7;
    if (a <= 0) continue;
    ctx.strokeStyle = `rgba(${r.col}, ${a})`;
    ctx.lineWidth = 1 + 7 * (1 - rr / maxR);
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, Math.PI * 2);
    ctx.stroke();
  }

  /* --- 完成闪光 --- */
  if (t >= T.FLASH && flashAt < 0) flashAt = t;
  if (flashAt > 0) {
    const f = clamp01(1 - (t - flashAt) / 0.7);
    if (f > 0) {
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
      g.addColorStop(0, `rgba(255, 235, 200, ${0.5 * f})`);
      g.addColorStop(0.35, `rgba(255, 200, 140, ${0.18 * f})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    if (t - flashAt > 0.8 && !finished) {
      finished = true;
      hintEl.classList.add("show");
    }
  }
  ctx.globalAlpha = 1;

  /* --- HUD / 进度 --- */
  if (t >= T.LOAD && !finished) hud.classList.add("show");
  const lp = clamp01((t - T.LOAD) / (T.LOAD_END - T.LOAD));
  const eased = easeInOutCubic(lp);
  // 模块加载式的顿挫感
  const stepped = Math.min(1, eased + 0.04 * Math.sin(lp * 26) * (1 - lp));
  const pct = Math.floor(stepped * 100);
  fillEl.style.width = pct + "%";
  pctEl.textContent = pct + "%";
  let label = STATUS_STEPS[0][1];
  for (const [th, name] of STATUS_STEPS) if (lp >= th - 0.001) label = name;
  const full = label === "READY";
  statusEl.innerHTML = full
    ? `<span style="color:#ffe2b0;text-shadow:0 0 14px rgba(255,179,107,.7)">READY</span>`
    : `${label} <span class="dim">${"·".repeat(1 + ((t * 3) | 0) % 3)}</span>`;

  /* --- 视差 --- */
  const parF = smooth(clamp01((t - T.REVEAL) / 1.2));
  px += (mx - px) * 0.05;
  py += (my - py) * 0.05;
  canvas.style.transform =
    `scale(1.045) translate(${(-px * 14 * parF).toFixed(2)}px, ${(-py * 10 * parF).toFixed(2)}px)`;
}

/* ---------- 启动 ---------- */
resize();
window.addEventListener("resize", () => {
  resize();
  if (targets.length) particles = targets.map(makeParticle);
});

icon.onload = () => {
  buildBlurIcon();
  targets = sampleTargets(2400);
  reset();
  if (reduced) t0 = performance.now() - (T.FLASH + 0.9) * 1000;
  if (!started) {
    started = true;
    requestAnimationFrame(frame);
  }
};

/* ---------- 2D 桌宠立绘循环（挥手互动） ---------- */
const peier = document.getElementById("peier");
const bubbleEl = document.getElementById("bubble");
const bubbleText = document.getElementById("bubbleText");
const FRAMES = [
  "peier-splash/frame-greet.png",
  "peier-splash/frame-idle.png",
  "peier-splash/frame-relaxed.png",
  "peier-splash/frame-idle.png"
];
let frameIdx = 0;
peier.src = FRAMES[0];
setInterval(() => {
  frameIdx = (frameIdx + 1) % FRAMES.length;
  peier.style.opacity = "0.3";
  setTimeout(() => {
    peier.src = FRAMES[frameIdx];
    peier.style.opacity = "0.92";
  }, 220);
}, 1500);

/* 气泡文案轮播 */
const BUBBLES = [
  ["你好呀，我是姵儿！", 2800],
  ["正在唤醒你的工作台…", 2600]
];
let bubbleIdx = 0;
function nextBubble() {
  if (bubbleIdx >= BUBBLES.length) {
    bubbleEl.classList.remove("show");
    return;
  }
  const [text, hold] = BUBBLES[bubbleIdx++];
  bubbleText.textContent = text;
  bubbleEl.classList.add("show");
  setTimeout(nextBubble, hold);
}
setTimeout(nextBubble, 300);
